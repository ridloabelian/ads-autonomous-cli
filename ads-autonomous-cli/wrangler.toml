#:schema node_modules/wrangler/config-schema.json
name = "ads-autonomous-api"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"

# KV Namespace for storing campaign data
# Run: wrangler kv:namespace create "CAMPAIGNS"
# Then update the id below
[[kv_namespaces]]
binding = "CAMPAIGNS"
id = "18b310b4119845b68c27655872d2cd51"

# Environment variables (non-sensitive)
[vars]
ENVIRONMENT = "production"

# Secrets (sensitive data - set with: wrangler secret put SECRET_NAME)
# GEMINI_API_KEY - set with: wrangler secret put GEMINI_API_KEY
# APIFY_API_KEY - set with: wrangler secret put APIFY_API_KEY

# Development configuration
[env.development]
name = "ads-autonomous-api-dev"
vars = { ENVIRONMENT = "development" }

# Production configuration
[env.production]
name = "ads-autonomous-api"
vars = { ENVIRONMENT = "production" }
